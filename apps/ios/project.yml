# Sparkjudge — the iOS app. The .xcodeproj is generated from this file:
#   cd apps/ios && xcodegen generate
name: Sparkjudge
options:
  bundleIdPrefix: com.morethancoder
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Sparkjudge:
    type: application
    platform: iOS
    sources:
      - path: Sparkjudge
    info:
      path: Sparkjudge/Info.plist
      properties:
        CFBundleDisplayName: Sparkjudge
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Sparkjudge listens while you hold the orb, so it can type your idea out as you say it. Audio never leaves your phone.
        NSSpeechRecognitionUsageDescription: Your words are transcribed on this device, so an idea is written down before it is gone.
        NSLocalNetworkUsageDescription: Sparkjudge can check ideas with an ideacheck server running on your own network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morethancoder.sparkjudge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  SparkjudgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SparkjudgeTests
    dependencies:
      - target: Sparkjudge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morethancoder.sparkjudge.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sparkjudge:
    build:
      targets:
        Sparkjudge: all
        SparkjudgeTests: [test]
    test:
      targets:
        - SparkjudgeTests
    run:
      config: Debug
