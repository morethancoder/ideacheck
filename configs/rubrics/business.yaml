# Question-writing rules (enforced by rubric.Validate):
#  - one judgment per question; "yes" must be the natural positive reading;
#  - every `choice` includes `other`; `score` has 2-10 levels, worded concretely, low -> high;
#  - weights are >= 0; every weighted question sets polarity (+1 good-when-high, -1 bad-when-high);
#  - `uses` lists only the state fields the question needs (idea, profile).
#  - `requires` (optional) names state the question cannot be judged without:
#    when it is absent the question is not asked, and its weight moves to the rest.
name: business
description: Evaluates product/startup ideas using YC-style criteria.
questions:
  - id: problem_acuity
    kind: score
    weight: 2.0
    polarity: 1
    uses: [idea]
    instructions: How acute is the problem this idea addresses?
    levels:
      - No real problem, or a mild inconvenience people ignore
      - A real annoyance with acceptable existing workarounds
      - A painful problem people solve with clumsy hacks or manual work
      - A blocking problem with no workable existing solution
  - id: sisp
    kind: noul
    weight: 1.5
    polarity: -1
    uses: [idea]
    instructions: The idea starts from a technology or trend and works backward to find a problem, rather than starting from a problem people already have.
    criteria:
      yes: The technology or trend comes first, and the problem or customer is vague, deferred, or picked to fit it.
      no: A specific problem or customer comes first, and the technology is how it gets solved.
  - id: audience_specificity
    kind: score
    weight: 1.0
    polarity: 1
    uses: [idea]
    instructions: How specific and reachable is the target audience?
    levels:
      - Everyone, or undefined
      - A broad demographic
      - A specific role, community, or situation
      - A specific role in a specific context with a clear place to find them
  - id: market_size
    kind: score
    weight: 1.0
    polarity: 1
    uses: [idea]
    instructions: Based only on the description in `idea`, how large could the market plausibly become?
    levels:
      - Tiny niche unlikely to grow
      - Small niche
      - Meaningful market or small but fast-growing
      - Large market today or clearly on track to become large
  - id: tarpit
    kind: noul
    weight: 1.5
    polarity: -1
    uses: [idea]
    instructions: This is an idea many people independently come up with and that has repeatedly been tried without success (for example apps to plan meetups with friends, generic social networks, restaurant or music discovery apps).
    criteria:
      yes: A common idea many teams have launched, in a category that keeps failing to become a lasting business.
      no: An idea few people arrive at on their own, or a category where earlier attempts did not repeatedly fail.
  - id: structural_barrier_named
    kind: noul
    weight: 1.0
    polarity: 1
    uses: [idea]
    instructions: The description in `idea` names a specific structural reason this has not been solved before and explains how this idea gets past it.
    criteria:
      yes: It names a concrete reason earlier attempts failed or could not happen (a missing technology, cost, rule, or access) and says how this idea gets past it.
      no: It gives no such reason, or only says it will be better, easier, or use AI.
  - id: competitors_exist
    kind: noul
    weight: 0
    polarity: 0
    uses: [idea]
    instructions: Products or services already exist that address substantially the same problem for the same audience.
    criteria:
      yes: At least one existing product or service already does this job for this audience, even imperfectly.
      no: No product or service does this job for this audience; people go without it or improvise by hand.
  - id: differentiating_insight
    kind: noul
    weight: 1.5
    polarity: 1
    uses: [idea]
    instructions: The description in `idea` contains a specific insight or approach that existing alternatives are missing.
    criteria:
      yes: It names something specific that existing alternatives do not do or do not know.
      no: It only claims to be better, simpler, cheaper, or AI-powered without saying what exactly differs.
  - id: why_now
    kind: score
    weight: 1.0
    polarity: 1
    uses: [idea]
    instructions: How strong is the reason this is newly possible or newly needed?
    levels:
      - Nothing has changed; this could have been built years ago
      - A weak or generic trend is cited
      - A specific recent change makes this newly possible or needed
      - A specific recent change makes this urgent and existing players are poorly positioned
  - id: proxy_exists
    kind: noul
    weight: 0.5
    polarity: 1
    uses: [idea]
    instructions: The description in `idea` points to a successful comparable business in another market, geography, or vertical that proves the model works.
  - id: scalability
    kind: score
    weight: 1.0
    polarity: 1
    uses: [idea]
    instructions: How well does revenue decouple from human effort as the business grows?
    levels:
      - Each customer requires significant manual work; a services business
      - Mostly software with a meaningful services component
      - Software with light onboarding or support
      - Pure software or self-serve; scales with near-zero marginal effort
  - id: idea_space
    kind: score
    weight: 0.5
    polarity: 1
    uses: [idea]
    instructions: How fertile is the surrounding space of adjacent ideas if this exact idea fails?
    levels:
      - Isolated idea; a pivot would mean starting over
      - A few related ideas nearby
      - A rich space with many adjacent problems and paying customers
  - id: founder_market_fit
    kind: score
    weight: 2.0
    polarity: 1
    uses: [idea, profile]
    # Without a profile this is a judgment of the input, not of the person, so
    # it is left unscored and its weight goes to the other questions.
    requires: [profile]
    instructions: How well matched is the background of the person in `profile` to this specific idea?
    levels:
      - No relevant skills, domain knowledge, or access
      - Can build it but has no domain insight or access to users
      - Has either the domain insight or the building skills plus a way to reach users
      - "Uniquely positioned: domain insight, building ability, and access to users"
  - id: personal_want
    kind: noul
    weight: 0.5
    polarity: 1
    uses: [idea, profile]
    requires: [profile]
    instructions: The person in `profile`, or people they know, would use this themselves.
  - id: clarity
    kind: score
    weight: 0.5
    polarity: 1
    uses: [idea]
    instructions: How clearly is the idea explained?
    levels:
      - Vague; hard to tell what it is
      - Understandable but missing key details
      - Clear and specific

verdict:
  gates:
    # Gates see NORMALIZED values in [0,1]. problem_acuity has 4 levels, so
    # "below level 1" (raw < 1.0) is normalized < 1/3.
    - when: "sisp > 0.8 && problem_acuity < 0.34"
      max: park
      reason: Solution in search of a problem
    - when: "tarpit > 0.7 && structural_barrier_named < 0.3"
      max: explore
      reason: Likely tarpit with no named way past the barrier
    - when: "competitors_exist > 0.7 && differentiating_insight < 0.3"
      max: explore
      reason: Crowded space with no stated differentiation
  thresholds:            # on composite in [0,1]
    build: 0.70
    explore: 0.50
    park: 0.30
    # below park → kill
  min_confidence: 0.45   # below this, verdict is reported as "uncertain" with the composite
  # Jev's nouls are calibrated probabilities, so they sit nearer the middle than
  # vote counts do. On bench/ideas.jsonl (jev-1.13.0, 2026-09-21) it put the
  # four labelled tarpits at 0.57-0.84 and every labelled non-tarpit at 0.18
  # or below: 0.7 missed three of the four. For a calibrated probability the
  # plain cut is 0.5, "more likely than not". Re-measure with
  # `make bench ARGS='-b jev'` after changing a question or moving the model.
  backends:
    jev:
      gates:
        - when: "sisp > 0.8 && problem_acuity < 0.34"
          max: park
          reason: Solution in search of a problem
        - when: "tarpit > 0.5 && structural_barrier_named < 0.3"
          max: explore
          reason: Likely tarpit with no named way past the barrier
        - when: "competitors_exist > 0.7 && differentiating_insight < 0.3"
          max: explore
          reason: Crowded space with no stated differentiation
