# Question-writing rules (enforced by rubric.Validate):
#  - one judgment per question; "yes" must be the natural positive reading;
#  - every `choice` includes `other`; `score` has 2-10 levels, worded concretely, low -> high;
#  - weights are >= 0; every weighted question sets polarity (+1 good-when-high, -1 bad-when-high);
#  - `uses` lists only the state fields the question needs (idea, profile, evidence).
#    `evidence.<topic>` reads one research topic; only topics some question reads are searched.
#    `evidence` is what a web search found (research.yaml lists the topics); it is
#    only there when the check could research. A question that merely benefits
#    from it lists it in `uses`; one that cannot be judged without it also sets
#    `requires: [evidence]`, and is skipped — not guessed — when nothing was searched.
#  - `requires` (optional) names state the question cannot be judged without:
#    when it is absent the question is not asked, and its weight moves to the rest.
name: research
description: Evaluates investigations, experiments, papers, and studies.
questions:
  - id: falsifiable
    kind: noul
    weight: 2.0
    polarity: 1
    uses: [idea]
    instructions: The description in `idea` poses a question that a specific observation or result could answer or refute.
  - id: novelty_stated
    kind: score
    weight: 1.5
    polarity: 1
    uses: [idea]
    instructions: How clearly does the description in `idea` position this against what is already known?
    levels:
      - Prior work is not mentioned
      - Prior work is mentioned without saying what is missing from it
      - A specific gap in prior work is named
      - A specific gap is named along with why earlier approaches could not close it
  - id: still_open
    kind: noul
    weight: 1.0
    polarity: 1
    uses: [idea, evidence.competitors, evidence.prior_attempts]
    # Whether the question is still open can only be judged against what a
    # search for existing work turned up.
    requires: [evidence]
    instructions: Nothing listed in `evidence.competitors` or `evidence.prior_attempts` has already answered the question the description in `idea` poses.
    criteria:
      yes: No listed work is described as having answered this question, or the listed work leaves the specific gap the description names.
      no: A listed work is described as having already answered this question.
  - id: feasibility
    kind: score
    weight: 1.5
    polarity: 1
    uses: [idea, profile]
    requires: [profile]
    instructions: How feasible is this with the resources the person in `profile` has?
    levels:
      - Requires data, equipment, or access the person does not have
      - Possible only after securing significant new resources
      - Feasible with modest additions to what the person has
      - Feasible today with what the person has
  - id: method_named
    kind: noul
    weight: 1.0
    polarity: 1
    uses: [idea]
    instructions: The description in `idea` names the method or data that will be used to answer the question.
  - id: why_now
    kind: score
    weight: 0.5
    polarity: 1
    uses: [idea, evidence.recent_changes]
    instructions: How strong is the reason this is newly possible or newly needed? When `evidence` is present, `evidence.recent_changes` lists recent changes a web search found.
    levels:
      - Nothing has changed; this could have been done years ago
      - A weak or generic trend is cited
      - A specific recent change makes this newly possible or needed
  - id: potential_impact
    kind: score
    weight: 1.5
    polarity: 1
    uses: [idea]
    instructions: If the work succeeds, how much would it matter to others?
    levels:
      - Of interest mainly to the author
      - Useful to a small specialist group
      - Changes how a field or a group of practitioners works
  - id: researcher_fit
    kind: score
    weight: 1.0
    polarity: 1
    uses: [idea, profile]
    requires: [profile]
    instructions: How well matched is the background of the person in `profile` to this investigation?
    levels:
      - No relevant training or experience
      - Adjacent experience
      - Direct experience with the methods or the domain
  - id: clarity
    kind: score
    weight: 0.5
    polarity: 1
    uses: [idea]
    instructions: How clearly is the idea explained?
    levels:
      - Vague; hard to tell what it is
      - Understandable but missing key details
      - Clear and specific

verdict:
  gates:
    - when: "falsifiable < 0.3"
      max: park
      reason: No question that a result could answer or refute
    - when: "feasibility < 0.2"
      max: explore
      reason: Requires resources the person does not have
  thresholds:
    build: 0.65
    explore: 0.45
    park: 0.30
  min_confidence: 0.45
