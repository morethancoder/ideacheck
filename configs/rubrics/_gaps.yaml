# Question-writing rules (enforced by rubric.Validate):
#  - one judgment per question; "yes" must be the natural positive reading;
#  - every `choice` includes `other`; `score` has 2-10 levels, worded concretely, low -> high;
#  - weights are >= 0; every weighted question sets polarity (+1 good-when-high, -1 bad-when-high);
#  - `uses` lists only the state fields the question needs (idea, profile, evidence).
#    `evidence` is what a web search found (research.yaml lists the topics); it is
#    only there when the check could research. A question that merely benefits
#    from it lists it in `uses`; one that cannot be judged without it also sets
#    `requires: [evidence]`, and is skipped — not guessed — when nothing was searched.
#  - `requires` (optional) names state the question cannot be judged without:
#    when it is absent the question is not asked, and its weight moves to the rest.
# `ask` is the follow-up shown to the user; `fills` is the intake field the reply is
# stored in (an idea field, or profile.<field>). A gap whose field is already
# filled is never asked. `derive: {present: [...]}` answers from which fields are
# filled instead of asking the judge (1 when any is, else 0).
threshold: 0.5
# How hard unstated facts discount a result's confidence when the idea is scored
# anyway (agent and server runs, or the TUI after it has asked once): the
# confidence is multiplied by 1 - confidence_penalty x (open gaps / questions).
confidence_penalty: 0.5
# The most follow-ups a person is asked in one check, taken in the order below
# (most important first). The rest are still reported in missing[] and still
# discount the confidence; they are just not worth turning a one-line idea into
# a form for. 0 = ask them all.
ask_limit: 3
questions:
  - id: has_problem
    kind: noul
    instructions: The description in `idea` states a specific problem that specific people have today.
    uses: [idea]
    ask: What problem does this solve, and for whom?
    fills: problem
  - id: has_audience
    kind: noul
    instructions: The description in `idea` names a specific target user or customer group.
    uses: [idea]
    ask: Who exactly is the first user? Be narrow.
    fills: audience
  - id: has_solution
    kind: noul
    instructions: The description in `idea` explains what the product or output actually is.
    uses: [idea]
    ask: What is the thing you would build or make, concretely?
    fills: solution
  - id: has_why_now
    kind: noul
    instructions: The description in `idea` gives a reason this is newly possible or newly needed now.
    uses: [idea]
    ask: What changed recently (technology, rules, behavior) that makes this possible or urgent now?
    fills: why_now
  - id: has_competitor_awareness
    kind: noul
    instructions: The description in `idea` mentions existing alternatives, competitors, or how people cope today.
    uses: [idea]
    ask: What do people use today instead? Name alternatives if you know any.
    fills: competitors_known
  - id: has_differentiation
    kind: noul
    instructions: The description in `idea` states what this does differently or better than existing alternatives.
    uses: [idea]
    ask: What is the one thing this does that existing options do not?
    fills: differentiation
  - id: has_founder_context
    kind: noul
    instructions: The profile in `profile` contains information about the person's skills, domain experience, or relationship to the problem.
    criteria:
      yes: "`profile` is present and states at least one of: the person's skills, their domain experience, or their relationship to the problem."
      no: "`profile` is absent or empty, or says nothing about the person's skills, experience, or relationship to the problem."
    uses: [profile]
    # Whether the profile says anything about the person is a question of
    # which fields are filled in: no model needed.
    derive:
      present: [profile.background, profile.skills, profile.domains, profile.would_use_myself]
    ask: What is your background relative to this idea (skills, domain, do you have this problem yourself)?
    fills: profile.background
