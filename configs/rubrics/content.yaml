# Question-writing rules (enforced by rubric.Validate):
#  - one judgment per question; "yes" must be the natural positive reading;
#  - every `choice` includes `other`; `score` has 2-10 levels, worded concretely, low -> high;
#  - weights are >= 0; every weighted question sets polarity (+1 good-when-high, -1 bad-when-high);
#  - `uses` lists only the state fields the question needs (idea, profile, evidence).
#    `evidence.<topic>` reads one research topic; only topics some question reads are searched.
#    `evidence` is what a web search found (research.yaml lists the topics); it is
#    only there when the check could research. A question that merely benefits
#    from it lists it in `uses`; one that cannot be judged without it also sets
#    `requires: [evidence]`, and is skipped — not guessed — when nothing was searched.
#  - `requires` (optional) names state the question cannot be judged without:
#    when it is absent the question is not asked, and its weight moves to the rest.
name: content
description: Evaluates blogs, newsletters, video series, podcasts, courses, and similar media.
questions:
  - id: audience_specificity
    kind: score
    weight: 1.5
    polarity: 1
    uses: [idea]
    instructions: How specific is the intended audience?
    levels:
      - Everyone, or undefined
      - A broad interest group
      - A specific role, community, or situation
      - A specific group with a clear place where they already gather
  - id: distribution_named
    kind: noul
    weight: 1.5
    polarity: 1
    uses: [idea]
    instructions: The description in `idea` names a specific channel through which the first audience will find this.
  - id: sustainable_cadence
    kind: score
    weight: 1.0
    polarity: 1
    uses: [idea, profile]
    requires: [profile]
    instructions: How sustainable is the planned publishing pace for the person in `profile`?
    levels:
      - No pace stated, or one that clearly cannot be kept up
      - Ambitious; likely to slip within months
      - Realistic for the time and material the person has
  - id: creator_credibility
    kind: score
    weight: 1.5
    polarity: 1
    uses: [idea, profile]
    requires: [profile]
    instructions: How credible is the person in `profile` on this topic?
    levels:
      - No stated experience with the topic
      - An interested amateur
      - A practitioner with direct experience
      - A recognized practitioner with unusual access or results
  - id: differentiated_angle
    kind: noul
    weight: 1.5
    polarity: 1
    uses: [idea]
    instructions: The description in `idea` states an angle or format that existing content on this topic does not offer.
  - id: angle_holds
    kind: noul
    weight: 1.0
    polarity: 1
    uses: [idea, evidence.competitors]
    # Whether the angle is really unoccupied can only be judged against a list
    # of what is already published.
    requires: [evidence]
    # No angle claimed is a "no" by the criteria below; a content idea's angle
    # is what the gaps call its differentiation.
    derive:
      zero_when_unstated: differentiation
    instructions: Nothing listed in `evidence.competitors` already offers the angle or format the description in `idea` claims as its own.
    criteria:
      yes: The description claims a specific angle or format, and nothing listed in `evidence.competitors` is described as already offering it.
      no: Something listed in `evidence.competitors` already offers that angle or format, or the description claims no specific angle.
  - id: audience_value
    kind: score
    weight: 1.0
    polarity: 1
    uses: [idea]
    instructions: How much would the intended audience gain from each piece?
    levels:
      - Little; interchangeable with what they already see
      - Mildly useful or entertaining
      - Something they would seek out and share
  - id: topic_depth
    kind: noul
    weight: 0.5
    polarity: 1
    uses: [idea]
    instructions: The topic has enough material to sustain many instalments.
  - id: clarity
    kind: score
    weight: 0.5
    polarity: 1
    uses: [idea]
    instructions: How clearly is the idea explained?
    levels:
      - Vague; hard to tell what it is
      - Understandable but missing key details
      - Clear and specific

verdict:
  gates:
    - when: "audience_specificity < 0.2 && distribution_named < 0.3"
      max: park
      reason: No defined audience and no way to reach one
    - when: "differentiated_angle < 0.3"
      max: explore
      reason: No stated angle that existing content lacks
  thresholds:
    build: 0.65
    explore: 0.45
    park: 0.30
  min_confidence: 0.45
