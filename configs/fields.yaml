# What you can tell ideacheck about an idea, and what each field means.
# `ideacheck fields` prints this; `ideacheck fields -o json` is the machine copy.
#
# Giving a field directly is more accurate than handing over a document and
# hoping the reader finds it: one short, specific sentence per field beats three
# pages of prose. Anything you leave out is read out of the document when there
# is one, and otherwise comes back in missing[] with the confidence discounted.
#
# The names here are fixed by the intake; this file gives them their meaning.

idea:
  - name: title
    description: What the thing is called.
    example: Vector Thread
  - name: problem
    description: The specific problem it solves, and for whom. Concrete beats broad.
    example: designers hand a design system to an AI coding agent and get back code that ignores it
  - name: audience
    description: The first users, narrowly. Not "everyone who ..." — the ten people who would use it this month.
    example: designers who already keep a DESIGN.md and work with coding agents daily
  - name: solution
    description: What would actually be built or made, in one or two sentences.
    example: a gallery of DESIGN.md files rendered live, with a validator, a token lab and a merge tool
  - name: why_now
    description: What changed recently — technology, rules, behavior — that makes this newly possible or newly needed. The single fact most often left out.
    example: Google Labs published an open DESIGN.md spec and coding agents now read design files directly
  - name: monetization
    description: How it would make money, or that it is deliberately not meant to.
    example: free gallery, paid team workspace for shared systems
  - name: competitors_known
    description: What people use today instead — named alternatives, or how they cope without one.
    example: getdesign.md, Refero Styles, design.dev's token editor; most people just paste tokens into the prompt
  - name: differentiation
    description: The one thing this does that the existing options do not.
    example: one page re-skinned by the file itself, so the demo is the product

profile:
  - name: background
    description: Your relationship to this idea — what you have built, what you know, whether you have the problem yourself. Without it, founder-fit questions are left unscored rather than guessed.
    example: solo dev, ten years in design tooling, I hit this every week
  - name: skills
    description: What you can build or do yourself.
    example: Go, SvelteKit, enough design to ship it alone
  - name: domains
    description: Fields you know from the inside.
    example: design systems, developer tooling
  - name: network
    description: Who you can already reach — users, buyers, distribution.
    example: 4k followers who are mostly designers; two agency friends who would pilot it
  - name: would_use_myself
    description: Whether you would use the finished thing yourself, and how often.
    example: yes, on every project I start
  - name: time_horizon
    description: How much time you actually have for this.
    example: evenings and weekends for about three months
