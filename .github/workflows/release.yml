# Publishes a release when a v* tag is pushed: `make release` creates the tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # goreleaser creates the release and uploads the archives

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser builds the changelog from the full history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
