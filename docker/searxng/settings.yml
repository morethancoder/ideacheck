# SearXNG settings for the instance `make up` starts: the defaults, plus the two
# things ideacheck needs. It is mounted read-only into the container; the secret
# key comes from the environment (scripts/searxng.sh makes one per container).
use_default_settings: true

search:
  formats:
    - html
    - json        # off by default; without it /search?format=json is a 403

server:
  limiter: false  # a private instance on 127.0.0.1: no bot detection, no Valkey needed
